<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itineraries — GlobeTrotter</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topnav">
  <div class="wordmark">GlobeTrotter</div>
  <ul class="topnav-links">
    <li><a class="topnav-link" href="/discover.html">Discover</a></li>
    <li><a class="topnav-link" href="/index.html">For You</a></li>
    <li><a class="topnav-link" href="/destinations.html">Destinations</a></li>
    <li><a class="topnav-link active" href="/itineraries.html">My Trips</a></li>
  </ul>
  <div class="topnav-right">
    <a class="avatar" id="avatar" href="/settings.html" aria-label="Settings"></a>
    <button type="button" class="topnav-logout" id="logout-link">Log Out</button>
  </div>
</nav>

<main class="content">
  <div class="content-header">
    <h1>Itineraries</h1>
    <p class="subtext">Your saved trips.</p>
  </div>

  <div class="itinerary-list" id="itinerary-list">
    <p class="subtext">Loading itineraries…</p>
  </div>
</main>

<script src="/js/api.js"></script>
<script>
  requireAuthOrRedirect();
  renderAvatarInitial(document.getElementById('avatar'));

  document.getElementById('logout-link').addEventListener('click', () => {
    logout();
  });

  function formatDateRange(it) {
    if (!it.start_date && !it.end_date) return null;
    return `${it.start_date || '?'} – ${it.end_date || '?'}`;
  }

  function renderItineraries(itineraries) {
    const container = document.getElementById('itinerary-list');
    container.innerHTML = '';

    itineraries.forEach((it) => {
      const row = document.createElement('a');
      row.className = 'itinerary-row';
      row.href = `/itinerary.html?id=${encodeURIComponent(it.id)}`;

      const photo = document.createElement('div');
      photo.className = 'itinerary-row-photo';
      if (typeof it.image === 'string' && it.image.trim() !== '') {
        const img = document.createElement('img');
        img.className = 'itinerary-row-photo-img';
        img.src = it.image;
        img.alt = it.title || '';
        photo.appendChild(img);
      }

      const info = document.createElement('div');
      info.className = 'itinerary-row-info';

      const title = document.createElement('div');
      title.className = 'itinerary-row-title';
      title.textContent = it.title;

      const destCount = Array.isArray(it.destinations) ? it.destinations.length : 0;
      const dateRange = formatDateRange(it);

      const meta = document.createElement('div');
      meta.className = 'itinerary-row-meta';
      meta.textContent = dateRange
        ? `${dateRange} · ${destCount} destination${destCount === 1 ? '' : 's'}`
        : `${destCount} destination${destCount === 1 ? '' : 's'}`;

      info.appendChild(title);
      info.appendChild(meta);

      const actions = document.createElement('div');
      actions.className = 'itinerary-row-actions';

      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'icon-btn';
      editBtn.setAttribute('aria-label', 'Edit itinerary');
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = `/new-itinerary.html?edit=${encodeURIComponent(it.id)}`;
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'icon-btn';
      deleteBtn.setAttribute('aria-label', 'Delete itinerary');
      deleteBtn.textContent = '🗑';
      deleteBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();

        if (!confirm('Delete this itinerary?')) return;

        try {
          await apiFetch(`/itineraries/${encodeURIComponent(it.id)}`, { method: 'DELETE' });
          loadItineraries();
        } catch (err) {
          alert(err.message);
        }
      });

      actions.appendChild(editBtn);
      actions.appendChild(deleteBtn);

      row.appendChild(photo);
      row.appendChild(info);
      row.appendChild(actions);
      container.appendChild(row);
    });

    const newRow = document.createElement('a');
    newRow.className = 'itinerary-row-new';
    newRow.href = '/new-itinerary.html';
    newRow.textContent = '+ New Itinerary';
    container.appendChild(newRow);
  }

  async function loadItineraries() {
    const container = document.getElementById('itinerary-list');
    try {
      const data = await apiFetch('/itineraries');
      renderItineraries(data);
    } catch (err) {
      container.innerHTML = `<p class="error-text visible">${err.message}</p>`;
    }
  }

  loadItineraries();
</script>
</body>
</html>
