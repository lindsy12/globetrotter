<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itineraries — GlobeTrotter</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="wordmark">GlobeTrotter</div>
    <ul class="nav-list">
      <li><a class="nav-item" href="/index.html">Home</a></li>
      <li><a class="nav-item" href="/destinations.html">Destinations</a></li>
      <li><a class="nav-item active" href="/itineraries.html">Itineraries</a></li>
      <li><a class="nav-item" href="/settings.html">Settings</a></li>
      <li><a class="nav-item" href="#" id="logout-link">Log Out</a></li>
    </ul>
  </nav>

  <main class="content">
    <div class="content-header">
      <h1>Itineraries</h1>
      <p class="subtext">Your saved trips.</p>
    </div>

    <div class="itinerary-list" id="itinerary-list">
      <p class="subtext">Loading itineraries…</p>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuthOrRedirect();

  document.getElementById('logout-link').addEventListener('click', (e) => {
    e.preventDefault();
    logout();
  });

  function formatDateRange(it) {
    if (!it.start_date && !it.end_date) return null;
    return `${it.start_date || '?'} – ${it.end_date || '?'}`;
  }

  function renderItineraries(itineraries) {
    const container = document.getElementById('itinerary-list');
    container.innerHTML = '';

    itineraries.forEach((it) => {
      const row = document.createElement('a');
      row.className = 'itinerary-row';
      row.href = `/itinerary.html?id=${encodeURIComponent(it.id)}`;

      const title = document.createElement('div');
      title.className = 'itinerary-row-title';
      title.textContent = it.title;

      const destCount = Array.isArray(it.destinations) ? it.destinations.length : 0;
      const dateRange = formatDateRange(it);

      const meta = document.createElement('div');
      meta.className = 'itinerary-row-meta';
      meta.textContent = dateRange
        ? `${dateRange} · ${destCount} destination${destCount === 1 ? '' : 's'}`
        : `${destCount} destination${destCount === 1 ? '' : 's'}`;

      row.appendChild(title);
      row.appendChild(meta);
      container.appendChild(row);
    });

    const newRow = document.createElement('a');
    newRow.className = 'itinerary-row-new';
    newRow.href = '/new-itinerary.html';
    newRow.textContent = '+ New Itinerary';
    container.appendChild(newRow);
  }

  async function loadItineraries() {
    const container = document.getElementById('itinerary-list');
    try {
      const data = await apiFetch('/itineraries');
      renderItineraries(data);
    } catch (err) {
      container.innerHTML = `<p class="error-text visible">${err.message}</p>`;
    }
  }

  loadItineraries();
</script>
</body>
</html>
