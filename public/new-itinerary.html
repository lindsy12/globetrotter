<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Itinerary — GlobeTrotter</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="wordmark">GlobeTrotter</div>
    <ul class="nav-list">
      <li><a class="nav-item" href="/index.html">Home</a></li>
      <li><a class="nav-item" href="/destinations.html">Destinations</a></li>
      <li><a class="nav-item active" href="/itineraries.html">Itineraries</a></li>
      <li><a class="nav-item" href="/settings.html">Settings</a></li>
      <li><a class="nav-item" href="#" id="logout-link">Log Out</a></li>
    </ul>
  </nav>

  <main class="content">
    <div class="content-header">
      <h1 id="page-heading">New Itinerary</h1>
      <p class="subtext">Plan out where you're headed next.</p>
    </div>

    <div class="card" style="padding: var(--space-6); max-width: 560px;">
      <form id="itinerary-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required>
        </div>

        <div class="field date-row">
          <div>
            <label for="start-date">Start date</label>
            <input type="date" id="start-date" name="start_date">
          </div>
          <div>
            <label for="end-date">End date</label>
            <input type="date" id="end-date" name="end_date">
          </div>
        </div>

        <div class="field">
          <label>Destinations</label>
          <div class="chip-row" id="destination-chips"></div>
          <div class="add-destination-row">
            <input type="text" id="destination-input" class="input" placeholder="Add a destination">
            <button type="button" id="add-destination-btn" class="btn-primary btn-small" aria-label="Add destination">+</button>
          </div>
        </div>

        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" class="input" rows="4"></textarea>
        </div>

        <p id="form-error" class="error-text"></p>
        <button type="submit" id="submit-btn" class="btn-primary btn-block">Save Itinerary</button>
      </form>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuthOrRedirect();

  document.getElementById('logout-link').addEventListener('click', (e) => {
    e.preventDefault();
    logout();
  });

  const destinations = [];

  function renderChips() {
    const container = document.getElementById('destination-chips');
    container.innerHTML = '';

    destinations.forEach((name, idx) => {
      const chip = document.createElement('span');
      chip.className = 'dest-chip';

      const label = document.createElement('span');
      label.textContent = name;

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', `Remove ${name}`);
      removeBtn.addEventListener('click', () => {
        destinations.splice(idx, 1);
        renderChips();
      });

      chip.appendChild(label);
      chip.appendChild(removeBtn);
      container.appendChild(chip);
    });
  }

  function addDestination(rawValue) {
    const value = rawValue.trim();
    if (!value) return;
    destinations.push(value);
    renderChips();
  }

  const destInput = document.getElementById('destination-input');

  document.getElementById('add-destination-btn').addEventListener('click', () => {
    addDestination(destInput.value);
    destInput.value = '';
    destInput.focus();
  });

  destInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addDestination(destInput.value);
      destInput.value = '';
    }
  });

  const editId = new URLSearchParams(window.location.search).get('edit');

  async function loadForEdit() {
    document.getElementById('page-heading').textContent = 'Edit Itinerary';
    document.getElementById('submit-btn').textContent = 'Save Changes';

    try {
      const itinerary = await apiFetch(`/itineraries/${encodeURIComponent(editId)}`);

      document.getElementById('title').value = itinerary.title || '';
      document.getElementById('start-date').value = itinerary.start_date || '';
      document.getElementById('end-date').value = itinerary.end_date || '';
      document.getElementById('notes').value = itinerary.notes || '';

      destinations.length = 0;
      (itinerary.destinations || []).forEach((name) => destinations.push(name));
      renderChips();
    } catch (err) {
      document.getElementById('form-error').textContent = err.message;
      document.getElementById('form-error').classList.add('visible');
    }
  }

  if (editId) {
    loadForEdit();
  } else {
    const prefillDestination = new URLSearchParams(window.location.search).get('destination');
    if (prefillDestination) {
      destinations.push(prefillDestination);
    }
    renderChips();
  }

  document.getElementById('itinerary-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    errorEl.classList.remove('visible');

    const title = document.getElementById('title').value.trim();
    const startDate = document.getElementById('start-date').value || null;
    const endDate = document.getElementById('end-date').value || null;
    const notes = document.getElementById('notes').value.trim();

    if (!title) {
      errorEl.textContent = 'Title is required';
      errorEl.classList.add('visible');
      return;
    }
    if (destinations.length === 0) {
      errorEl.textContent = 'Add at least one destination';
      errorEl.classList.add('visible');
      return;
    }

    const body = JSON.stringify({
      title,
      destinations,
      notes,
      start_date: startDate,
      end_date: endDate,
    });

    try {
      if (editId) {
        await apiFetch(`/itineraries/${encodeURIComponent(editId)}`, { method: 'PUT', body });
      } else {
        await apiFetch('/itineraries', { method: 'POST', body });
      }
      window.location.href = '/itineraries.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('visible');
    }
  });
</script>
</body>
</html>
